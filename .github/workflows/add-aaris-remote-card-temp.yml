name: Add Aaris Remote card (temporary)

permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  patch-more-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Patch More Apps catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if "id: 'aaris-remote'" in text:
              print('Aaris Remote already present; no duplicate change needed.')
              raise SystemExit(0)
          old = """            downloadUrl: 'https://github.com/Aaris-khan/financial-record-diarybook-last/releases/download/aaris-pharma-v1/Aaris-Pharmacy.apk'\n        })\n    ]);"""
          new = """            downloadUrl: 'https://github.com/Aaris-khan/financial-record-diarybook-last/releases/download/aaris-pharma-v1/Aaris-Pharmacy.apk'\n        }),\n        Object.freeze({\n            id: 'aaris-remote',\n            name: 'Aaris Remote',\n            description: 'Fast, secure Android remote screen sharing and control.',\n            icon: 'fa-solid fa-mobile-screen-button',\n            downloadUrl: 'https://github.com/Aaris-khan/financial-record-diarybook-last/releases/download/Aaris-remote/AarisRemote-1.9.9'\n        })\n    ]);"""
          if old not in text:
              raise SystemExit('Expected Aaris Pharmacy catalogue anchor not found; refusing unsafe patch.')
          updated = text.replace(old, new, 1)
          assert updated.count("id: 'aaris-quran'") == 1
          assert updated.count("id: 'aaris-pharmacy'") == 1
          assert updated.count("id: 'aaris-remote'") == 1
          path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          if git diff --quiet -- index.html; then
            echo 'No index change to commit.'
            exit 0
          fi
          git config user.name 'Aaris-khan'
          git config user.email 'hhakmuddin8@gmail.com'
          git add index.html
          git commit -m 'Add Aaris Remote to More Apps'
          git push origin HEAD:main
