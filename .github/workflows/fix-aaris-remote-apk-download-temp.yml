name: Fix Aaris Remote APK download (temporary)

permissions:
  contents: write

on:
  push:
    branches: [ main ]

jobs:
  fix-apk-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Rename release asset and update website link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          ASSET_ID=608890334
          gh api --method PATCH -H "Accept: application/vnd.github+json" "/repos/${REPO}/releases/assets/${ASSET_ID}" -f name='AarisRemote-1.9.9.apk' >/tmp/asset.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='https://github.com/Aaris-khan/financial-record-diarybook-last/releases/download/Aaris-remote/AarisRemote-1.9.9'
          new=old+'.apk'
          if new not in s:
              if old not in s:
                  raise SystemExit('old Aaris Remote URL not found')
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          if ! git diff --quiet -- index.html; then
            git config user.name 'Aaris-khan'
            git config user.email 'hhakmuddin8@gmail.com'
            git add index.html
            git commit -m 'Fix Aaris Remote APK download filename'
            git push origin HEAD:main
          fi
