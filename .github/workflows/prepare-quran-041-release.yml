name: Prepare Aaris Quran 0.4.1 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-quran-041-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable public APK release placeholder
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="aaris-quran-0.4.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target main               --title "Aaris Quran 0.4.1"               --notes "Public APK distribution release for Aaris Quran 0.4.1. Quran source code is maintained separately; public audio assets are served from the dedicated immutable audio release."
          fi
