name: Finalize Quran public audio catalog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-quran-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPO: Aaris-khan/quran-app-advance
      SOURCE_TAG: quran-word-audio-muallim-v1-9796e08
      TARGET_TAG: quran-word-audio-public-v1-9796e08
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Build self-contained public catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mirror
          gh release download "$SOURCE_TAG"             --repo "$SOURCE_REPO"             --pattern catalog.json             --dir mirror
          python3 - <<'PY'
          from pathlib import Path
          p=Path("mirror/catalog.json")
          text=p.read_text(encoding="utf-8")
          old="https://github.com/Aaris-khan/quran-app-advance/releases/download/quran-word-audio-muallim-v1-9796e08"
          new="https://github.com/Aaris-khan/financial-record-diarybook-last/releases/download/quran-word-audio-public-v1-9796e08"
          if text.count(old)!=115:
              raise SystemExit(f"Unexpected old-host occurrence count: {text.count(old)}")
          p.write_text(text.replace(old,new),encoding="utf-8")
          PY

      - name: Replace only public catalog metadata
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TARGET_TAG" mirror/catalog.json             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Verify release shape
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_TAG" --jq '.assets | length')"
          test "$COUNT" -eq 115
